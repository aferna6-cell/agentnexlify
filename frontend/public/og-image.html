<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: #08090f;
    font-family: "Segoe UI", Arial, sans-serif;
    overflow: hidden;
    position: relative;
  }
  .glow {
    position: absolute;
    width: 620px;
    height: 430px;
    top: 55px;
    left: 290px;
    border-radius: 999px;
    background: radial-gradient(circle, rgba(0, 191, 255, 0.22), rgba(8, 9, 15, 0) 68%);
  }
  .logo {
    position: absolute;
    width: 650px;
    height: auto;
    left: 275px;
    top: 92px;
  }
  .line {
    position: absolute;
    left: 72px;
    bottom: 82px;
    color: #f5f8ff;
    font-size: 42px;
    font-weight: 800;
    letter-spacing: 0.01em;
  }
  .link {
    position: absolute;
    left: 76px;
    bottom: 35px;
    color: #00bfff;
    font-size: 28px;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <img class="logo" src="/logo.png" alt="AgentNexLiFy" />
  <div class="line">AI that helps run your business</div>
  <div class="link">agentnexlify.com</div>
</body>
</html>
