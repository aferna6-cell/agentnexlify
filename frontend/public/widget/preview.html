<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Widget Preview</title>
  <style>
    body {
      margin: 0;
      background: #1a1a2e;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #aaa;
    }
    p { text-align: center; font-size: 14px; }
  </style>
</head>
<body>
  <p id="status">Loading widget preview...</p>
  <script>
    // Read config from query params and write the widget script tag
    // Using document.write ensures the script is parser-inserted so
    // document.currentScript works reliably in the widget JS.
    (function () {
      var params = new URLSearchParams(window.location.search);
      var apiKey = params.get("key") || "";
      var apiBase = params.get("base") || "";
      if (!apiKey) {
        document.getElementById("status").textContent =
          "No API key provided. Configure your widget first.";
        return;
      }
      var attrs = ' data-api-key="' + apiKey + '"';
      if (apiBase) attrs += ' data-api-base="' + apiBase + '"';
      document.write('<scr' + 'ipt src="./agentnexlify-widget.js"' + attrs + '><\/scr' + 'ipt>');
    })();
  </script>
</body>
</html>
