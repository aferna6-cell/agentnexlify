# Aider configuration for AgentNexLiFy
# Use with: aider (uses defaults below)
# Or override: aider --model ollama/qwen3-coder:30b
# OpenRouter key is in .env (OPENROUTER_API_KEY)

# Default: Use Qwen 3.6 Plus via OpenRouter (free preview)
model: openrouter/qwen/qwen3.6-plus-preview:free

# Auto-commit disabled (use Claude Code for git)
auto-commits: false
auto-lint: false

# Dark theme
dark-mode: true

# Show diffs
show-diffs: true

# Map the repo for context
map-tokens: 4096
