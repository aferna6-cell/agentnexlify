body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,sans-serif;overflow:hidden}
#app{display:grid;grid-template-columns:270px 1fr 320px;height:100vh}

h1{font-size:15px;margin:0 0 2px}
.sub{color:var(--dim);font-size:12px;margin-bottom:12px}

.chip .dot{width:8px;height:8px;border-radius:50%}
.chip.off{opacity:.35}
.note{padding:7px 9px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.note:hover{background:var(--panel2)}
.note.sel{background:var(--panel2);border-color:var(--acc)}
.note .t{font-weight:600;font-size:13px}
.note .m{color:var(--dim);font-size:11px}
#graphwrap{position:relative}
canvas{display:block;cursor:grab}
#legend{position:absolute;bottom:10px;left:10px;font-size:11px;color:var(--dim);background:color-mix(in srgb,var(--panel) 80%,transparent);padding:6px 8px;border-radius:8px;border:1px solid var(--line);max-width:60%}
#hud{position:absolute;top:10px;left:10px;font-size:12px;color:var(--dim)}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.metric{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.metric .n{font-size:20px;font-weight:700}
.metric .l{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.good{color:#a6e3a1}

d sell AgentNexLiFy as vertical-specific packs on one shared engine. \"Do not sell AI automation as the main noun.\"", "links": ["Competitive Landscape", "Vertical Knowledge-Base Moat", "Vertical Packs", "planning-vertical-positioning"]}, {"id": "Agent OS Graph Memory", "label": "Agent OS Graph Memory", "type": "decision", "folder": "Decisions", "summary": "Initially (2026-05-25) defer the Agent OS graph-memory layer beyond launch; ship semantic memory only. Superseded 2026-06-09: build it after the owner requested a \"what do you know about my business\" view.", "links": ["2026-06-09 Agent OS Production Merge", "Agent OS", "Claude Model Routing", "planning-decision-graph-memory"]}, {"id": "2026-06-09 Agent OS Production Merge", "label": "2026-06-09 Agent OS Production Merge", "type": "decision", "folder": "Decisions", "summary": "Vendor the Agent OS engine from the standalone Agent-Nexlify-OS repo into agentnexlify/agent-service/src/agent-os/ and make it the only agent path in production (PRs #203–#208, #219). The canonical engine now lives in the agentnexlify repo.", "links": ["Agent OS", "Agent OS Graph Memory", "Agent Service", "repo-agent-os-readme"]}, {"id": "FastAPI without ORM", "label": "FastAPI without ORM", "type": "decision", "folder": "Decisions", "summary": "Use FastAPI with the direct Supabase client and raw SQL numbered migrations. No SQLAlchemy/Alembic ORM.", "links": ["AgentNexLiFy Platform", "Database Migration Workflow", "client_id vs tenant_id", "dev-knowledge-architecture-decisions", "eng-memory-lessons-learned"]}, {"id": "Remove Free Tier Gate Signup", "label": "Remove Free Tier Gate Signup", "type": "decision", "folder": "Decisions", "summary": "Eliminate the free signup path. Require a valid payment method at signup; grandfather existing tenants. (#291, #298)", "links": ["2026-06-15 Plan Repricing", "Convert Beta Tenants to Paid", "Kill Trial Charge On Signup", "connector-github-history"]}, {"id": "client_id vs tenant_id", "label": "client_id vs tenant_id", "type": "topic", "folder": "Topics", "summary": "On the leads and conversations tables the tenant foreign key is client_id, not tenant_id. Other tables use tenant_id. Confusing the two has shipped 3+ production bugs; the client_id fix landed in migration 076, canonical baseline migration #106.", "links": ["Database Migration Workflow", "Multi-Tenant Architecture", "User Engineering Rules", "dev-knowledge-canonical-schema", "repo-agentnexlify-claude-md"]}, {"id": "Database Schema", "label": "Database Schema", "type": "topic", "folder": "Topics", "summary": "The AgentNexLiFy Platform Supabase database (project pxserpybmajixqrmzaly, org VoltOps) has ~130 public tables, RLS enabled on every table. Grouped by domain:", "links": ["Agent OS", "AgentNexLiFy Platform", "Multi-Tenant Architecture", "VoltOps", "client_id vs tenant_id", "connector-supabase-schema"]}, {"id": "Compound Operating System", "label": "Compound Operating System", "type": "topic", "folder": "Topics", "summary": "The product thesis that phone/missed-call textback, bids, client portal, reviews, CRM, and appointments are integrated modules sharing one data model — so \"data flows in a circle\" and churn approaches zero. AgentNexLiFy aims to be a small business's operating ", "links": ["Competitive Landscape", "Multi-Tenant Architecture", "Vertical Knowledge-Base Moat", "dev-knowledge-architecture-decisions"]}, {"id": "Vendor Stack", "label": "Vendor Stack", "type": "topic", "folder": "Topics", "summary": "Third-party services AgentNexLiFy depends on.", "links": ["AgentNexLiFy Platform", "Anthropic", "SSE not WebSockets", "VoltOps", "dev-knowledge-architecture-decisions", "docs-deployment-surfaces", "repo-agentnexlify-claude-md"]}, {"id": "Multi-Tenant Architecture", "label": "Multi-Tenant Architecture", "type": "topic", "folder": "Topics", "summary": "AgentNexLiFy is multi-tenant from day one: every request carries a tenant/client ID, every table has RLS, and no query is un-scoped. A planned agency hierarchy (Platform  Agency  Business) supports white-label resale.", "links": ["AgentNexLiFy Platform", "Compound Operating System", "client_id vs tenant_id", "dev-knowledge-architecture-decisions", "dev-knowledge-canonical-schema", "repo-agentnexlify-claude-md"]}, {"id": "Competitive Landscape", "label": "Competitive Landscape", "type": "topic", "folder": "Topics", "summary": "AgentNexLiFy competes in the small-business AI front-desk / lead-capture space.", "links": ["AgentNexLiFy", "Compound Operating System", "GoHighLevel", "Vertical Knowledge-Base Moat", "Vertical Packs", "dev-knowledge-architecture-decisions", "kb-index", "repo-agentnexlify-claude-md"]}, {"id": "Drafts-Only Approval Loop", "label": "Drafts-Only Approval Loop", "type": "topic", "folder": "Topics", "summary": "Agent OS worker agents produce drafts for owner approval, not auto-sends. Each draft comes with an honest reasoning trace. never_auto_send is enforced for sensitive actions (complaints, payments). This is the core trust mechanic of the product.", "links": ["Advisor-Executor Pattern", "Agent OS", "Claude Managed Agents", "repo-agent-os-readme"]}, {"id": "Claude Model Routing", "label": "Claude Model Routing", "type": "topic", "folder": "Topics", "summary": "The rule for which Anthropic Claude model to use per task: - claude-haiku-4-5-20251001 — mechanical (grammar, formatting, renames, classification). - claude-sonnet-4-6 — code, debug, multi-file edits, most execution. - claude-opus-4-7 — planning, architecture,", "links": ["Advisor-Executor Pattern", "Anthropic", "User Engineering Rules", "repo-agentnexlify-claude-md"]}, {"id": "Advisor-Executor Pattern", "label": "Advisor-Executor Pattern", "type": "topic", "folder": "Topics", "summary": "A cost-control agent pattern: Opus 4.7 advises (read-only brief) → Sonnet executes → Haiku cleans. Delivers near-Opus quality at ~1.3x pure-Sonnet cost instead of ~5x pure-Opus.", "links": ["Agent OS", "Claude Managed Agents", "Claude Model R   let best=null,bd=400;for(const n of DATA.nodes){if(!visible(n))continue;const d=(n.x-mx)**2+(n.y-my)**2;if(d<bd){bd=d;best=n}}if(best)select(best.id)};
let ticks=0;
function step(){if(ticks++>320)return;for(const n of DATA.nodes){n.vx*=.86;n.vy*=.86}
  for(let i=0;i<DATA.nodes.length;i++)for(let j=i+1;j<DATA.nodes.length;j++){const a=DATA.nodes[i],b=DATA.nodes[j];
    let dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||1,f=1400/(d*d);a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f}
  for(const e of E){const a=N[e.source],b=N[e.target];let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,f=(d-92)*.008;
    a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f}
  for(const n of DATA.nodes){n.x+=n.vx;n.y+=n.vy}}
function draw(){ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(ox,oy);ctx.scale(z,z);
  const nbr=new Set();if(sel){nbr.add(sel);E.forEach(e=>{if(e.source===sel)nbr.add(e.target);if(e.target===sel)nbr.add(e.source)})}
  for(const e of E){const a=N[e.source],b=N[e.target];if(!visible(a)||!visible(b))continue;
    const on=sel&&(e.source===sel||e.target===sel);
    ctx.strokeStyle=on?'rgba(137,180,250,.7)':'rgba(120,130,160,.16)';ctx.lineWidth=on?1.4/z:0.6/z;
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
  for(const n of DATA.nodes){if(!visible(n))continue;const r=4+Math.min(deg[n.id]||0,11);
    const dim=sel&&!nbr.has(n.id);ctx.globalAlpha=dim?0.28:1;
    ctx.fillStyle=COL[n.type]||COL.note;ctx.beginPath();ctx.arc(n.x,n.y,r,0,7);ctx.fill();
    if(n.id===sel){ctx.strokeStyle='#fff';ctx.lineWidth=2/z;ctx.stroke()}
    if(z>0.75||n.id===sel){ctx.globalAlpha=dim?0.4:1;ctx.fillStyle=getComputedStyle(document.body).color;
      ctx.font=(10/z<3?10:10)+'px system-ui';ctx.fillText(n.label,n.x+r+3,n.y+3)}}
  ctx.globalAlpha=1;ctx.restore()}
document.getElementById('hud').textContent='drag to pan · scroll to zoom · click a node';
function loop(){step();draw();requestAnimationFrame(loop)}loop();
document.getElementById('theme').onclick=()=>{const r=document.documentElement;
  const cur=r.getAttribute('data-theme');r.setAttribute('data-theme',cur==='light'?'dark':'light')};
renderList();
</script></body></html>
