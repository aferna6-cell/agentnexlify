name: Public Uptime Watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: public-uptime-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    name: Public Uptime Watch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ops/monitoring/uptime-checks.json
            scripts/monitoring/public_uptime_probe.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Probe public endpoints
        env:
          SLACK_ALERT_WEBHOOK_URL: ${{ secrets.SLACK_ALERT_WEBHOOK_URL }}
        run: python scripts/monitoring/public_uptime_probe.py
