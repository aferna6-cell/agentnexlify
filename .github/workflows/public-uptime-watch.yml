name: Public Uptime Watch

on:
  schedule:
    - cron: "0 */2 * * *"  # every 2h — throttled 2026-06-22 from */30 (quota still exhausting; uptime belongs on an external monitor, not Actions)
  workflow_dispatch: {}

concurrency:
  group: public-uptime-watch
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  probe:
    name: Public Uptime Watch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ops/monitoring/uptime-checks.json
            scripts/monitoring/public_uptime_probe.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Probe public endpoints
        id: probe
        run: |
          set -o pipefail
          python scripts/monitoring/public_uptime_probe.py | tee probe-output.txt

      # Best-effort email alert on failure via Resend. Never hard-fails the
      # job: the GitHub-issue step below stays the durable alert of record.
      - name: Email owner on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_ALERT_EMAIL: ${{ secrets.OWNER_ALERT_EMAIL }}
        run: |
          chmod +x scripts/monitoring/send-alert-email.sh
          BODY="$(printf 'Public uptime probe failed.\n\n%s\n\nRun: %s/%s/actions/runs/%s' \
            "$(cat probe-output.txt 2>/dev/null || echo '(no probe output captured)')" \
            "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}")"
          bash scripts/monitoring/send-alert-email.sh "DOWNTIME: public uptime probe failing" "${BODY}"

      # A failed probe must still reach a human even if email send is skipped:
      # open (or comment on) a pinned downtime issue.
      - name: Alert via GitHub issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try { output = fs.readFileSync('probe-output.txt', 'utf8'); } catch {}
            const title = 'DOWNTIME: public uptime probe failing';
            const body = [
              'The Public Uptime Watch probe failed.',
              '',
              '```',
              output.trim() || '(no probe output captured)',
              '```',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'uptime',
            });
            const existing = open.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ['uptime', 'critical'],
              });
            }
