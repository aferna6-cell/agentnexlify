name: Public Uptime Watch

on:
  schedule:
    - cron: "*/30 * * * *"  # throttled 2026-06-18 from */5 to conserve Actions minutes (exhausted quota)
  workflow_dispatch: {}

concurrency:
  group: public-uptime-watch
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  probe:
    name: Public Uptime Watch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ops/monitoring/uptime-checks.json
            scripts/monitoring/public_uptime_probe.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe public endpoints
        id: probe
        env:
          SLACK_ALERT_WEBHOOK_URL: ${{ secrets.SLACK_ALERT_WEBHOOK_URL }}
        run: python scripts/monitoring/public_uptime_probe.py | tee probe-output.txt

      # Slack secret is not configured yet, so a failed probe must still
      # reach a human: open (or comment on) a pinned downtime issue.
      - name: Alert via GitHub issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try { output = fs.readFileSync('probe-output.txt', 'utf8'); } catch {}
            const title = 'DOWNTIME: public uptime probe failing';
            const body = [
              'The Public Uptime Watch probe failed.',
              '',
              '```',
              output.trim() || '(no probe output captured)',
              '```',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'uptime',
            });
            const existing = open.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ['uptime', 'critical'],
              });
            }
