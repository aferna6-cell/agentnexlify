name: Refresh Second Brain

# Keeps brain/ current as GitHub + Supabase change.
# Runs the deterministic refresh (read-only against connectors), regenerates the graph,
# re-validates, and commits any changes back. Set repo secret SUPABASE_ACCESS_TOKEN to
# enable the Supabase half; the GitHub half uses the built-in token.

on:
  # NO `schedule:` — this job is owned by a Claude Code Routine, not by Actions.
  #
  # History: parked 2026-07-20 on "0 6 31 2 *" (Feb 31) because the
  # brain-refresh credentials were broken (#394) and every run burned minutes
  # (#500). That comment used to say 'Restore "17 7 * * *" after fixing'.
  # DO NOT DO THAT. On 2026-07-23 a Routine took this job over, so restoring
  # the cron would give two writers committing brain traces to the repo.
  #
  # A parked cron is also not inert — see kb-autopopulate.yml for the observed
  # dispatch-despite-Feb-31 behaviour. Removing `schedule:` is the actual fix.
  #
  # Owner: Routine "Weekly brain connector refresh (CCR self-bind)",
  # cron 0 9 * * 1.
  # Rationale: planning/decisions/2026-08-24-actions-replacement-substrate.md
  workflow_dispatch: {}

permissions:
  contents: write
  # refresh_connectors.py lists issues + PRs; a scoped permissions block sets
  # unlisted scopes to `none`, which made github.token 403 on the issues API
  # for 8+ days (issues #392/#394). These two read grants are the fix.
  issues: read
  pull-requests: read

concurrency:
  group: refresh-brain
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brain
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Refresh connectors (read-only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: pxserpybmajixqrmzaly
        run: python3 _tools/refresh_connectors.py

      - name: Rebuild graph
        run: python3 _tools/export_graph.py

      - name: Validate
        run: python3 _tools/run_all.py

      - name: Commit changes
        run: |
          git config user.name "brain-refresh[bot]"
          git config user.email "brain-refresh@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "brain: scheduled refresh from GitHub + Supabase"
            git push
          fi
