name: Weekly Mutation Tests

on:
  # NO `schedule:` — Actions have been dark since 2026-07-20 (GH #500,
  # spending limit): jobs die in ~1s before checkout, so this monitored
  # nothing while still reporting red. Uniform red hides the next real
  # failure, so the schedule is removed rather than left to fail on a timer.
  # `workflow_dispatch` is retained — this is still runnable by hand.
  #
  # UNOWNED — no replacement is running. Previous cron: "0 13 * * 1".
  # 90-minute mutmut run: too heavy for a Routine and it needs no working
  # tree write, so this one genuinely wants a runner. It stays manual until
  # Actions billing is restored or a self-hosted runner is attached.
  # Tracked in: planning/decisions/2026-08-24-actions-replacement-substrate.md
  workflow_dispatch:

jobs:
  mutation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install backend and mutation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest mutmut

      - name: Run mutation tests on critical backend modules
        run: |
          rm -rf mutants
          mutmut run --max-children 2

      - name: Fail on surviving or suspicious mutants
        run: |
          RESULTS="$(mutmut results || true)"
          if [ -n "$RESULTS" ]; then
            echo "$RESULTS"
            echo "::error::Surviving/suspicious mutants detected. Strengthen tests for these paths."
            exit 1
          fi
          echo "No surviving or suspicious mutants."
