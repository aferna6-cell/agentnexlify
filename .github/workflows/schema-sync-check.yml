name: Schema Sync Check

# Counts unapplied migrations in schema-log.md vs migrations/*.sql files.
# Flags CRITICAL pending migrations (those with "Critical:" near "Applied: Pending").
#
# Triggers:
#   - Push to main touching migrations/ or schema-log.md
#   - Manual (workflow_dispatch). The daily 7 AM UTC sweep was removed —
#     see the note on the `on:` block below.
#
# Opens a GH issue when:
#   - Any CRITICAL pending migration exists, OR
#   - More than 10 migrations are pending total

on:
  push:
    branches: [main]
    paths:
      - "migrations/**"
      - "docs/dev-knowledge/schema-log.md"
  # NO `schedule:` — Actions have been dark since 2026-07-20 (GH #500,
  # spending limit): jobs die in ~1s before checkout, so this monitored
  # nothing while still reporting red. Uniform red hides the next real
  # failure, so the schedule is removed rather than left to fail on a timer.
  # `workflow_dispatch` is retained — this is still runnable by hand.
  #
  # UNOWNED on a timer — no replacement is running. Previous cron: "0 7 * * *".
  # The `push` trigger above is untouched and still the real gate for
  # schema drift on main; only the daily sweep is removed.
  # Issues-API only → backend `_automation_loop` %30 tier.
  # Tracked in: planning/decisions/2026-08-24-actions-replacement-substrate.md
  workflow_dispatch: {}

# The audit step opens a GH issue when critical migrations are pending.
# Without issues:write the default GITHUB_TOKEN gets 403 ("Resource not
# accessible by integration") and the whole run goes red even though the
# check ran correctly.
permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Pending Migrations Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Count pending migrations
        id: count
        run: |
          TOTAL_SQL=$(ls migrations/*.sql 2>/dev/null | wc -l | tr -d ' ')
          echo "Total migration files: $TOTAL_SQL"

          PENDING=$(grep -c '\*\*Applied:\*\* Pending' docs/dev-knowledge/schema-log.md 2>/dev/null || echo 0)
          echo "Pending (unapplied): $PENDING"

          CRITICAL=$(python3 - <<'PYEOF'
          import re, sys
          try:
              text = open("docs/dev-knowledge/schema-log.md").read()
              blocks = [m.start() for m in re.finditer(r'\*\*Applied:\*\* Pending', text)]
              count = 0
              for pos in blocks:
                  window = text[max(0, pos-300):pos+300]
                  if re.search(r'\bCritical\b', window, re.IGNORECASE):
                      count += 1
              print(count)
          except Exception:
              print(0)
          PYEOF
          )
          echo "Critical pending: $CRITICAL"

          python3 - <<'PYEOF' > pending-list.txt 2>/dev/null || true
          import re
          text = open("docs/dev-knowledge/schema-log.md").read()
          sections = re.split(r'\n(?=### )', text)
          names = []
          for section in sections:
              if '**Applied:** Pending' in section:
                  m = re.match(r'### (.+)', section)
                  if m:
                      names.append(m.group(1).strip())
          print('\n'.join(names))
          PYEOF

          echo "total_sql=$TOTAL_SQL" >> $GITHUB_OUTPUT
          echo "pending=$PENDING" >> $GITHUB_OUTPUT
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT

      - name: Report
        run: |
          echo "### Schema Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Migration files | ${{ steps.count.outputs.total_sql }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pending (unapplied) | ${{ steps.count.outputs.pending }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Critical pending | ${{ steps.count.outputs.critical }} |" >> $GITHUB_STEP_SUMMARY
          if [ -s pending-list.txt ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Pending migrations:**" >> $GITHUB_STEP_SUMMARY
            cat pending-list.txt | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Create issue if threshold exceeded
        uses: actions/github-script@v9
        with:
          script: |
            const pending  = parseInt('${{ steps.count.outputs.pending }}')  || 0;
            const critical = parseInt('${{ steps.count.outputs.critical }}') || 0;
            const totalSql = parseInt('${{ steps.count.outputs.total_sql }}') || 0;

            if (critical === 0 && pending <= 10) {
              console.log('Schema sync OK: ' + pending + ' pending, 0 critical.');
              return;
            }

            const fs = require('fs');
            const list = fs.existsSync('pending-list.txt')
              ? fs.readFileSync('pending-list.txt', 'utf8').trim() : '';

            const severity = critical > 0 ? 'CRITICAL' : 'WARNING';
            const labelColor = critical > 0 ? 'dc2626' : 'f59e0b';
            const labels = critical > 0
              ? ['automated', 'schema', 'critical']
              : ['automated', 'schema', 'maintenance'];

            const criticalNote = critical > 0
              ? '\n> [!] CRITICAL migrations block features in production. Apply immediately.'
              : '';

            const body = [
              '## Schema Sync Alert -- ' + new Date().toISOString().split('T')[0],
              '',
              '| Metric | Count |',
              '|--------|-------|',
              '| Total migration files | ' + totalSql + ' |',
              '| Pending (unapplied) | ' + pending + ' |',
              '| Critical pending | ' + critical + ' |',
              '',
              '### Pending migrations',
              list ? list.split('\n').map(l => '- ' + l).join('\n') : '_none extracted_',
              '',
              '---',
              '**To apply:**',
              '```',
              'mcp__supabase__apply_migration  (preferred)',
              '# OR: Supabase Dashboard -> SQL Editor',
              '```',
              '',
              '> See `docs/dev-knowledge/schema-log.md` for full details.',
              criticalNote,
            ].join('\n');

            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner, repo: context.repo.repo,
                  name: label, color: labelColor
                });
              } catch {}
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Schema Sync [' + severity + ']: ' + pending + ' pending migrations -- ' + new Date().toISOString().split('T')[0],
              body,
              labels
            });

  live-drift:
    # Diffs LIVE Supabase columns (hot_table_columns() RPC, migration 136)
    # against ops/schema/expected-columns.json. Born from the 2026-06-10
    # incident: migrations/001 listed columns the live DB never had and prod
    # signups 500'd. Skips cleanly when secrets are absent (forks).
    name: Live Column Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diff live schema vs manifest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          rc=0
          python3 scripts/check_schema_drift.py || rc=$?
          if [ "$rc" = "2" ]; then
            echo "::warning::Live drift check skipped (no Supabase secrets in this context)"
            exit 0
          fi
          exit $rc
