name: Schema Sync Check

# Counts unapplied migrations in schema-log.md vs migrations/*.sql files.
# Flags CRITICAL pending migrations (ones where the log entry mentions
# "Critical:" near "Applied: Pending") — these block features in prod.
#
# Triggers:
#   - Push to main touching migrations/ or schema-log.md (immediate check)
#   - Daily at 7 AM UTC (catch drift over time)
#
# Opens a GH issue when:
#   - Any CRITICAL pending migration exists, OR
#   - More than 10 migrations are pending total

on:
  push:
    branches: [main]
    paths:
      - "migrations/**"
      - "docs/dev-knowledge/schema-log.md"
  schedule:
    - cron: "0 7 * * *"   # 7 AM UTC daily
  workflow_dispatch: {}

jobs:
  check:
    name: Pending Migrations Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Count pending migrations
        id: count
        run: |
          # Total SQL files
          TOTAL_SQL=$(ls migrations/*.sql 2>/dev/null | wc -l | tr -d ' ')
          echo "Total migration files: $TOTAL_SQL"

          # Pending entries: lines containing "**Applied:** Pending"
          PENDING=$(grep -c '\*\*Applied:\*\* Pending' docs/dev-knowledge/schema-log.md 2>/dev/null || echo 0)
          echo "Pending (unapplied): $PENDING"

          # Critical: "Critical" keyword appears near a pending block
          # Look for lines that match both patterns in a 10-line window
          CRITICAL=$(python3 - <<'PYEOF'
          import re, sys
          try:
              text = open("docs/dev-knowledge/schema-log.md").read()
              # Find each "Applied: Pending" block and check if "Critical" appears
              # within the surrounding 300 chars
              blocks = [m.start() for m in re.finditer(r'\*\*Applied:\*\* Pending', text)]
              count = 0
              for pos in blocks:
                  window = text[max(0, pos-300):pos+300]
                  if re.search(r'\bCritical\b', window, re.IGNORECASE):
                      count += 1
              print(count)
          except Exception as e:
              print(0)
          PYEOF
          )
          echo "Critical pending: $CRITICAL"

          # Extract pending migration names
          python3 - <<'PYEOF' > pending-list.txt 2>/dev/null || true
          import re
          text = open("docs/dev-knowledge/schema-log.md").read()
          # Split on migration headings, find ones with "Applied: Pending"
          sections = re.split(r'\n(?=### )', text)
          names = []
          for section in sections:
              if '**Applied:** Pending' in section:
                  m = re.match(r'### (.+)', section)
                  if m:
                      names.append(m.group(1).strip())
          print('\n'.join(names))
          PYEOF

          echo "total_sql=$TOTAL_SQL" >> $GITHUB_OUTPUT
          echo "pending=$PENDING" >> $GITHUB_OUTPUT
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT

      - name: Report
        run: |
          echo "### Schema Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Migration files | ${{ steps.count.outputs.total_sql }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pending (unapplied) | ${{ steps.count.outputs.pending }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Critical pending | ${{ steps.count.outputs.critical }} |" >> $GITHUB_STEP_SUMMARY
          if [ -s pending-list.txt ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Pending migrations:**" >> $GITHUB_STEP_SUMMARY
            cat pending-list.txt | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Create issue if threshold exceeded
        uses: actions/github-script@v7
        with:
          script: |
            const pending  = parseInt('${{ steps.count.outputs.pending }}')  || 0;
            const critical = parseInt('${{ steps.count.outputs.critical }}') || 0;
            const totalSql = parseInt('${{ steps.count.outputs.total_sql }}') || 0;

            if (critical === 0 && pending <= 10) {
              console.log(`Schema sync OK: ${pending} pending, 0 critical.`);
              return;
            }

            const fs = require('fs');
            const list = fs.existsSync('pending-list.txt')
              ? fs.readFileSync('pending-list.txt', 'utf8').trim() : '';

            const severity = critical > 0 ? 'CRITICAL' : 'WARNING';
            const labels = critical > 0
              ? ['automated', 'schema', 'critical']
              : ['automated', 'schema', 'maintenance'];

            const body = [
              `## Schema Sync Alert — ${new Date().toISOString().split('T')[0]}`,
              '',
              `| Metric | Count |`,
              `|--------|-------|`,
              `| Total migration files | ${totalSql} |`,
              `| Pending (unapplied) | ${pending} |`,
              `| Critical pending | ${critical} |`,
              '',
              '### Pending migrations',
              list ? list.split('\n').map(l => `- ${l}`).join('\n') : '_none extracted_',
              '',
              '---',
              '**To apply:**',
              '```',
              'mcp__supabase__apply_migration  (preferred)',
              '# OR: Supabase Dashboard → SQL Editor',
              '```',
              '',
              `> See \`docs/dev-knowledge/schema-log.md\` for full migration details.`,
              critical > 0
                ? `\n> ⚠️ **CRITICAL migrations block features in production. Apply immediately.**`
                : '',
            ].join('\n');

            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner, repo: context.repo.repo,
                  name: label, color: critical > 0 ? 'dc2626' : 'f59e0b'
                });
              } catch {}
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Schema Sync [${severity}]: ${pending} pending migrations — ${new Date().toISOString().split('T')[0]}`,
              body,
              labels
            });
