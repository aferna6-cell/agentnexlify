name: PR Validation

# Triggers trimmed 2026-06-18: GitHub Actions minute quota was exhausted, so
# every job failed at runner allocation (~2s, HTTP 404 logs). The push-to-main
# trigger double-charged minutes on every merge (PR run + push run for the same
# commit). Dropped `push: branches: [main]` — `pull_request` still gates real
# PRs and `workflow_dispatch` allows a manual run. Local pre-merge verification
# now runs via `bash scripts/ci_local.sh`, which mirrors these gates with zero
# Actions minutes. Re-add the push trigger once minutes are topped up if a
# belt-and-suspenders main-branch gate is wanted.
on:
  pull_request:
  workflow_dispatch: {}

# Cancel a PR's in-flight validation when a new commit is pushed to the same PR.
# Re-pushes during review were stacking full runs and draining the Actions
# minute quota (the same quota exhaustion that makes jobs die at runner
# allocation). One run per ref at a time. (2026-06-22)
concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: PR Validation
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'team/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve compare ref
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --prune origin "${{ github.base_ref }}"
            BASE_REF="origin/${{ github.base_ref }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE_REF="${{ github.event.before }}"
          else
            BASE_REF="HEAD^"
          fi

          COMPARE_REF="$(git merge-base "$BASE_REF" HEAD 2>/dev/null || true)"
          if [ -z "$COMPARE_REF" ]; then
            COMPARE_REF="$BASE_REF"
          fi

          echo "COMPARE_REF=$COMPARE_REF" >> "$GITHUB_ENV"
          echo "Resolved compare ref: $COMPARE_REF"

      - name: Check diff hygiene
        run: |
          git diff --check "$COMPARE_REF" HEAD

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Semgrep
        run: python -m pip install --upgrade pip semgrep

      - name: Run Semgrep appsec scan
        run: semgrep scan --config auto

      - name: Check agent system guardrails
        run: python scripts/check_agent_system.py

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            demo-platform/package-lock.json

      - name: Install and audit root JS dependencies
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Run root quick check
        run: npm run check:quick

      # The Agent OS engine (departments, orchestrator, action layer) lives in
      # agent-service and had no CI coverage — its tests ran only locally. They
      # are fast (node:test, no network, no database) and they guard the action
      # layer's approval + verification rules.
      - name: Agent OS engine (agent-service) typecheck + tests
        run: |
          cd agent-service
          npm ci
          npm run typecheck
          npm test

      - name: Audit demo JS dependencies
        run: |
          cd demo-platform
          npm ci
          npm audit --audit-level=high

      - name: Lint JS/TS test quality
        run: npm run lint:test-quality

      - name: Lint Python test quality
        run: python scripts/lint_python_test_quality.py

      - name: Check local Python test references
        run: python scripts/check_test_local_refs.py

      - name: Check for dangerous patterns
        run: |
          ERRORS=0

          # __future__ annotations in routers. Anchor to an actual import
          # statement (optional leading whitespace) so docstrings/comments that
          # merely DOCUMENT the rule ("no `from __future__ import annotations`")
          # are not false-positives. Mirrors scripts/check_project_invariants.py.
          if grep -rnE "^[[:space:]]*from __future__ import annotations" backend/routers/ 2>/dev/null; then
            echo "::error::from __future__ import annotations found in router files. This breaks FastAPI request parsing."
            ERRORS=$((ERRORS + 1))
          fi

          # Hardcoded secrets
          if grep -rn "sk_live_\|sk_test_\|sk-ant-" backend/ frontend/src/ --include="*.py" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" 2>/dev/null; then
            echo "::error::Possible hardcoded secrets detected"
            ERRORS=$((ERRORS + 1))
          fi

          # .env files in PR
          if git diff --name-only "$COMPARE_REF" HEAD 2>/dev/null | grep -q "\.env"; then
            echo "::error::.env file in diff. Never commit env files."
            ERRORS=$((ERRORS + 1))
          fi

          # Bare except blocks (warning only)
          BARE=$(grep -rn "except.*:.*pass" backend/ --include="*.py" 2>/dev/null || true)
          if [ -n "$BARE" ]; then
            echo "::warning::Bare except blocks found. These can hide real errors."
            echo "$BARE"
          fi

          # Schema: lead_stage usage (should be status)
          if grep -rn "lead_stage" backend/ --include="*.py" 2>/dev/null | grep -v "#"; then
            echo "::warning::Found lead_stage references. Leads table uses status, not lead_stage."
          fi

          if [ $ERRORS -gt 0 ]; then
            echo ""
            echo "$ERRORS critical issue(s) found. Fix before merging."
            exit 1
          fi

      - name: Install backend test and coverage dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest pytest-asyncio pytest-cov pytest-timeout diff-cover pip-audit

      - name: Managed Agents preflight
        run: python scripts/managed_agents/preflight.py

      - name: Run backend tests with coverage
        run: |
          python -m pytest tests backend/tests/test_local_seo_handlers.py backend/tests/test_billing_amount_to_plan.py backend/tests/test_two_plan_repricing.py backend/tests/test_fraud_guard.py backend/tests/test_twilio_webhooks.py backend/tests/test_zapier_auth.py backend/tests/test_qualification_rubrics.py backend/tests/test_qualifier_config.py backend/tests/test_lead_qualification.py backend/tests/test_activity.py backend/tests/test_widget_health.py backend/tests/test_email_sequences_processing.py backend/tests/test_integration_key_vault.py backend/tests/test_integration_health_checker.py backend/tests/test_integration_keys_router.py backend/tests/test_platform_mailer.py backend/tests/test_os_failure_notify.py backend/tests/test_platform_support.py backend/tests/test_support_contact.py backend/tests/test_os_engine_cutover.py backend/tests/test_security_followups.py backend/tests/test_pay_gate.py backend/tests/test_pay_gate_unlock.py backend/tests/test_owner_paid_alert.py backend/tests/test_trial_expiry_paygate.py backend/tests/test_trial_end_capture.py backend/tests/test_conversion_funnel.py backend/tests/test_security_hardening.py backend/tests/test_instant_kb.py backend/tests/test_conversation_enrichment.py backend/tests/test_batch_runtime.py backend/tests/test_agent_os_bridge.py backend/tests/test_conversation_insights_job.py backend/tests/test_lead_alerts.py backend/tests/test_front_desk_health.py backend/tests/test_analytics_split_smoke.py backend/tests/test_os_usage_endpoint.py backend/tests/test_os_workforce_plan_gate.py backend/tests/test_signup_alert.py backend/tests/test_url_validation.py backend/tests/test_weekly_funnel_report.py backend/tests/test_onboarding_default_hours.py backend/tests/test_voice_booking.py backend/tests/test_sms_compliance_router.py backend/tests/test_lead_sources_analytics.py backend/tests/test_voice_incoming_call.py backend/tests/test_voice_plan_gate.py backend/tests/test_oauth_service_wiring.py backend/tests/test_voice_respond_integration.py backend/tests/test_voice_phone_routing.py backend/tests/test_voice_usage.py backend/tests/test_funnel_metrics.py backend/tests/test_tenant_kb.py backend/tests/test_drive_kb_sync.py backend/tests/test_local_kb_sync_cli.py backend/tests/test_connector_awareness.py backend/tests/test_os_engine_cutover.py backend/tests/test_widget_chat.py backend/tests/test_referral_reward.py backend/tests/test_demo_seed_widget_payload.py backend/tests/test_widget_guard.py backend/tests/test_analytics_common.py backend/tests/test_internal_tenants.py backend/tests/test_booking_prompt.py backend/tests/test_booking_alerts.py backend/tests/test_appointment_reminders.py backend/tests/test_reschedule_reminders.py backend/tests/test_create_appointment_owner_alert.py backend/tests/test_appointment_customer_notify.py backend/tests/test_lead_alert_dispatch.py backend/tests/test_activation_nudges_lastcall.py backend/tests/test_os_starter_tasks.py backend/tests/test_os_recipient_override.py backend/tests/test_os_actions.py backend/tests/test_os_tool_executions.py backend/tests/test_gmail_send_message.py backend/tests/test_notify_common.py backend/tests/test_os_routing_memory.py backend/tests/test_os_opportunity_fulfill.py backend/tests/test_os_inbound_bridge.py backend/tests/test_os_draft_expiry.py backend/tests/test_os_opportunities.py backend/tests/test_admin_loop_health.py backend/tests/test_loop_health_scan.py backend/tests/test_appointment_auto_complete.py backend/tests/test_attribution_analytics.py backend/tests/test_platform_flags.py backend/tests/test_admin_voice_test.py backend/tests/test_widget_chat_pipeline.py backend/tests/test_widget_chat_fallback.py backend/tests/test_invoices_router.py backend/tests/test_integration_vault_readers.py -q --cov=backend --cov-report=xml:coverage-python.xml

      # Security-critical: the integration key vault must keep 100% line+branch
      # coverage (GH #131). A dedicated gate so a future edit can't quietly drop it.
      - name: Integration key vault — 100% coverage gate
        run: |
          python -m pytest backend/tests/test_integration_key_vault.py -q \
            --cov=backend.services.integration_key_vault --cov-branch --cov-fail-under=100

      - name: Audit backend Python dependencies
        continue-on-error: true
        run: pip-audit -r backend/requirements.txt --progress-spinner off

      - name: Run JS coverage tests when configured
        run: |
          if [ -f "frontend/package.json" ] && node -e "const p=require('./frontend/package.json'); process.exit(p.scripts && p.scripts['test:coverage'] ? 0 : 1)"; then
            echo "Running frontend test:coverage"
            (cd frontend && npm ci && npm run test:coverage)
          else
            echo "frontend test:coverage is not configured."
          fi

          if [ -f "demo-platform/package.json" ] && node -e "const p=require('./demo-platform/package.json'); process.exit(p.scripts && p.scripts['test:coverage'] ? 0 : 1)"; then
            echo "Running demo-platform test:coverage"
            (cd demo-platform && npm ci && npm run test:coverage)
          else
            echo "demo-platform test:coverage is not configured."
          fi

      - name: Enforce changed-lines coverage
        run: |
          python scripts/check_changed_lines_coverage.py \
            --compare-branch "$COMPARE_REF" \
            --python-report coverage-python.xml \
            --python-fail-under 85 \
            --js-report frontend/coverage/lcov.info \
            --js-report demo-platform/coverage/lcov.info \
            --js-report coverage/lcov.info \
            --js-fail-under 80

      - name: Frontend tests
        run: |
          cd frontend
          npm ci
          npm run test -- --run

      - name: Audit frontend JS dependencies
        run: |
          cd frontend
          npm audit --audit-level=high

      - name: Frontend build check
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Check migration numbering
        run: |
          # Only fail when a migration ADDED in this PR collides with an existing
          # number — the intent (catch new collisions like PR #212's 133/134/135).
          # Pre-existing historical duplicates (e.g. 005/007 from early dev) are
          # out of scope and must not block every future migration PR.
          CHANGED_MIGRATIONS=$(git diff --name-only "$COMPARE_REF" HEAD -- migrations/ 2>/dev/null || true)
          if [ -n "$CHANGED_MIGRATIONS" ]; then
            echo "New/changed migrations:"
            echo "$CHANGED_MIGRATIONS"
            FAIL=0
            NEW_NUMS=$(echo "$CHANGED_MIGRATIONS" | sed 's#.*/##' | grep -oE '^[0-9]+' | sort -u)
            for n in $NEW_NUMS; do
              COUNT=$(ls "migrations/${n}_"*.sql 2>/dev/null | wc -l)
              if [ "$COUNT" -gt 1 ]; then
                echo "::error::Migration number $n is duplicated — a migration added in this PR collides with an existing one. Renumber to the next free number."
                ls "migrations/${n}_"*.sql
                FAIL=1
              fi
            done
            [ "$FAIL" -eq 0 ] || exit 1
          fi

      - name: Check migrations are logged in schema-log.md
        run: python scripts/check_migration_schema_log.py --compare-branch "$COMPARE_REF"

      - name: Widget sync check
        run: python scripts/sync_widget_assets.py --check
