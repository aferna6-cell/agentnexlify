name: Daily Business Digest

# Three parallel jobs each day:
#   1. lead-funnel  - new/stale/enrichment breakdown, alert on anomalies
#   2. churn-scan   - paid tenants with no activity in 7-14d
#   3. cost-alert   - AI message volume per tenant, flag spikes
#
# Required secrets (add in repo Settings -> Secrets -> Actions):
#   SUPABASE_URL          - from Supabase project settings
#   SUPABASE_SERVICE_KEY  - service_role key (bypasses RLS)
#
# Workflows exit 0 silently when secrets are missing.

on:
  schedule:
    - cron: "0 8 * * *"   # 8 AM UTC daily
  workflow_dispatch: {}

# Every job files deduped tracking issues via github-script. The default
# GITHUB_TOKEN here is read-only (Metadata: read), so without this block
# each "create issue" step 403s with "Resource not accessible by
# integration" — caught live on the 2026-07-17 loop-health run. Same
# pattern as public-uptime-watch.yml and schema-sync-check.yml.
permissions:
  contents: read
  issues: write

jobs:
  lead-funnel:
    name: Lead Funnel Digest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Analyse lead funnel
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python - <<'PYEOF'
          import os, json, urllib.request, sys
          from datetime import datetime, timezone, timedelta

          url = os.environ.get("SUPABASE_URL", "")
          key = os.environ.get("SUPABASE_SERVICE_KEY", "")
          if not url or not key:
              print("::warning::SUPABASE_URL or SUPABASE_SERVICE_KEY not set -- skipping lead funnel digest")
              sys.exit(0)

          hdrs = {"apikey": key, "Authorization": "Bearer " + key}

          def get(table, params):
              req = urllib.request.Request(
                  url + "/rest/v1/" + table + "?" + params, headers=hdrs
              )
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          now = datetime.now(timezone.utc)
          today_cutoff = (now - timedelta(hours=24)).isoformat()
          week_cutoff  = (now - timedelta(days=7)).isoformat()
          stale_cutoff = (now - timedelta(days=7)).isoformat()

          leads_today = get("leads", "select=id,status,enrichment_source,lead_temperature&created_at=gte." + today_cutoff + "&limit=1000")
          leads_week  = get("leads", "select=id,status,enrichment_source,lead_temperature&created_at=gte." + week_cutoff  + "&limit=1000")
          stale_new   = get("leads", "select=id&status=eq.new&created_at=lte." + stale_cutoff + "&limit=1000")

          status_counts = {}
          for l in leads_week:
              s = l.get("status") or "unknown"
              status_counts[s] = status_counts.get(s, 0) + 1

          temp_counts = {}
          for l in leads_week:
              t = l.get("lead_temperature") or "unknown"
              temp_counts[t] = temp_counts.get(t, 0) + 1

          ai_ct    = sum(1 for l in leads_week if l.get("enrichment_source") == "ai")
          regex_ct = sum(1 for l in leads_week if l.get("enrichment_source") == "regex")
          none_ct  = sum(1 for l in leads_week if not l.get("enrichment_source"))

          lines = [
              "## Lead Funnel Digest -- " + now.strftime("%Y-%m-%d"),
              "",
              "| Metric | Count |",
              "|--------|-------|",
              "| New leads today | " + str(len(leads_today)) + " |",
              "| New leads this week | " + str(len(leads_week)) + " |",
              "| Stale uncontacted (new >7d) | " + str(len(stale_new)) + " |",
              "",
              "### Status (this week)",
          ]
          for s, c in sorted(status_counts.items(), key=lambda x: -x[1]):
              lines.append("- " + s + ": " + str(c))

          lines += [
              "",
              "### Enrichment (this week)",
              "- AI enriched: " + str(ai_ct),
              "- Regex enriched: " + str(regex_ct),
              "- Unenriched: " + str(none_ct),
              "",
              "### Temperature (this week)",
          ]
          for t, c in sorted(temp_counts.items(), key=lambda x: -x[1]):
              lines.append("- " + t + ": " + str(c))

          digest = "\n".join(lines)
          print(digest)

          with open("lead-funnel-digest.md", "w") as f:
              f.write(digest)

          alert_reasons = []
          if len(leads_today) < 3:
              alert_reasons.append("Only " + str(len(leads_today)) + " new leads today (threshold: 3)")
          if len(stale_new) > 20:
              alert_reasons.append(str(len(stale_new)) + " stale uncontacted new leads (threshold: 20)")

          if alert_reasons:
              with open("lead-funnel-alert.txt", "w") as f:
                  f.write("\n".join(alert_reasons))
          PYEOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lead-funnel-digest
          path: lead-funnel-digest.md
          if-no-files-found: ignore

      - name: Create issue on anomaly
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('lead-funnel-alert.txt')) return;
            const alert = fs.readFileSync('lead-funnel-alert.txt', 'utf8').trim();
            if (!alert) return;
            const digest = fs.existsSync('lead-funnel-digest.md')
              ? fs.readFileSync('lead-funnel-digest.md', 'utf8') : '';
            for (const label of ['automated', 'lead-funnel']) {
              try { await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label, color: 'ededed' }); } catch (e) { if (e.status !== 422) console.warn('createLabel failed:', e.status, e.message); }
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Lead Funnel Alert -- ' + new Date().toISOString().split('T')[0],
              body: '## Alert\n' + alert + '\n\n' + digest,
              labels: ['automated', 'lead-funnel']
            });

  churn-scan:
    name: Churn Signal Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for churn signals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python - <<'PYEOF'
          import os, json, urllib.request, sys
          from datetime import datetime, timezone, timedelta

          url = os.environ.get("SUPABASE_URL", "")
          key = os.environ.get("SUPABASE_SERVICE_KEY", "")
          if not url or not key:
              print("::warning::SUPABASE_URL or SUPABASE_SERVICE_KEY not set -- skipping churn scan")
              sys.exit(0)

          hdrs = {"apikey": key, "Authorization": "Bearer " + key}

          def get(table, params):
              req = urllib.request.Request(
                  url + "/rest/v1/" + table + "?" + params, headers=hdrs
              )
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          now = datetime.now(timezone.utc)
          lead_cutoff = (now - timedelta(days=7)).isoformat()
          conv_cutoff = (now - timedelta(days=14)).isoformat()

          tenants = get("tenants", "select=id,business_name,plan,created_at&plan=neq.free&limit=500")

          # Exclude internal/smoke/demo tenants using the SAME canonical denylist
          # the backend services use (loaded from the checked-out repo — the
          # module has zero imports). Without this the "AgentNexLiFy Smoke Test"
          # tenant shows up as a churn-risk "paid customer" (found 2026-07-15).
          import importlib.util as _ilu
          _spec = _ilu.spec_from_file_location("internal_tenants", "backend/services/internal_tenants.py")
          _it = _ilu.module_from_spec(_spec); _spec.loader.exec_module(_it)
          tenants = [t for t in tenants if not _it.is_internal_tenant(t)]

          # 2 queries instead of 2N -- efficient for any tenant count
          recent_leads = get("leads", "select=client_id&created_at=gte." + lead_cutoff + "&limit=5000")
          active_lead_tids = {l["client_id"] for l in recent_leads if l.get("client_id")}

          recent_convs = get("conversations", "select=client_id&created_at=gte." + conv_cutoff + "&limit=5000")
          active_conv_tids = {c["client_id"] for c in recent_convs if c.get("client_id")}

          active = active_lead_tids | active_conv_tids
          churn_risks = [t for t in tenants if t["id"] not in active]

          if not churn_risks:
              print("No churn signals detected.")
              sys.exit(0)

          lines = [
              "## Churn Risk Report -- " + now.strftime("%Y-%m-%d"),
              "",
              str(len(churn_risks)) + " paid tenant(s) with no leads in 7d and no conversations in 14d:",
              "",
          ]
          for t in churn_risks:
              name = t.get("business_name") or t["id"][:8]
              created = (t.get("created_at") or "")[:10]
              lines.append("- **" + name + "** (plan: " + t["plan"] + ", customer since: " + created + ")")

          lines += [
              "",
              "> Criteria: paid plan + no new leads.created_at in 7d + no conversations.created_at in 14d.",
              "> Consider reaching out or checking if widget is still embedded.",
          ]

          report = "\n".join(lines)
          print(report)
          with open("churn-report.md", "w") as f:
              f.write(report)
          with open("churn-alert.txt", "w") as f:
              f.write(str(len(churn_risks)))
          PYEOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: churn-report
          path: churn-report.md
          if-no-files-found: ignore

      - name: Create issue on churn signals
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('churn-alert.txt')) return;
            const count = parseInt(fs.readFileSync('churn-alert.txt', 'utf8').trim()) || 0;
            if (count === 0) return;
            const report = fs.existsSync('churn-report.md')
              ? fs.readFileSync('churn-report.md', 'utf8') : '';
            for (const label of ['automated', 'churn-risk']) {
              try { await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label, color: 'e11d48' }); } catch (e) { if (e.status !== 422) console.warn('createLabel failed:', e.status, e.message); }
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Churn Risk: ' + count + ' tenant(s) inactive -- ' + new Date().toISOString().split('T')[0],
              body: report,
              labels: ['automated', 'churn-risk']
            });

  cost-alert:
    name: Claude Cost-Per-Tenant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check AI usage per tenant
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python - <<'PYEOF'
          import os, json, urllib.request, sys
          from datetime import datetime, timezone, timedelta
          from collections import Counter

          url = os.environ.get("SUPABASE_URL", "")
          key = os.environ.get("SUPABASE_SERVICE_KEY", "")
          if not url or not key:
              print("::warning::SUPABASE_URL or SUPABASE_SERVICE_KEY not set -- skipping cost alert")
              sys.exit(0)

          hdrs = {"apikey": key, "Authorization": "Bearer " + key}

          def get(table, params):
              req = urllib.request.Request(
                  url + "/rest/v1/" + table + "?" + params, headers=hdrs
              )
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          now = datetime.now(timezone.utc)
          since = (now - timedelta(hours=24)).isoformat()

          # chat_messages uses tenant_id directly (migration 006)
          msgs = get("chat_messages", "select=tenant_id,role&created_at=gte." + since + "&role=eq.assistant&limit=10000")

          if not msgs:
              print("No assistant messages in last 24h.")
              sys.exit(0)

          counts = Counter(m["tenant_id"] for m in msgs if m.get("tenant_id"))

          # ~$0.002/message (Haiku baseline -- actual varies by model)
          COST_PER_MSG = 0.002
          THRESHOLD = 100  # assistant messages/day before alerting (~$0.20)

          tenant_ids = list(counts.keys())
          tenants_raw = get("tenants", "select=id,business_name,plan&limit=500") if tenant_ids else []

          # Drop internal/smoke/demo tenants (canonical denylist from the repo)
          # so their AI usage never triggers a false cost-spike alert — the
          # smoke-test tenant sent 510 messages/30d (found 2026-07-15).
          import importlib.util as _ilu
          _spec = _ilu.spec_from_file_location("internal_tenants", "backend/services/internal_tenants.py")
          _it = _ilu.module_from_spec(_spec); _spec.loader.exec_module(_it)
          tenant_map = {t["id"]: t for t in tenants_raw}
          _internal_ids = {tid for tid, t in tenant_map.items() if _it.is_internal_tenant(t)}
          counts = Counter({tid: n for tid, n in counts.items() if tid not in _internal_ids})

          total_msgs = sum(counts.values())
          total_cost = total_msgs * COST_PER_MSG

          lines = [
              "## AI Usage Report -- " + now.strftime("%Y-%m-%d") + " (last 24h)",
              "",
              "Total assistant messages: " + str(total_msgs),
              "Estimated cost: $" + format(total_cost, ".3f"),
              "",
              "| Tenant | Plan | Messages | Est. Cost | Status |",
              "|--------|------|----------|-----------|--------|",
          ]

          alerts = []
          for tid, count in counts.most_common():
              t = tenant_map.get(tid, {})
              name = t.get("business_name") or tid[:12]
              plan = t.get("plan") or "unknown"
              cost = count * COST_PER_MSG
              flag = "HIGH [!]" if count > THRESHOLD else "OK"
              lines.append("| " + name + " | " + plan + " | " + str(count) + " | $" + format(cost, ".3f") + " | " + flag + " |")
              if count > THRESHOLD:
                  alerts.append(name + " (" + plan + "): " + str(count) + " messages (~$" + format(cost, ".2f") + "/day)")

          report = "\n".join(lines)
          print(report)
          with open("cost-report.md", "w") as f:
              f.write(report)

          if alerts:
              with open("cost-alert.txt", "w") as f:
                  f.write("\n".join(alerts))
          PYEOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cost-report
          path: cost-report.md
          if-no-files-found: ignore

      - name: Create issue on cost spike
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('cost-alert.txt')) return;
            const alert = fs.readFileSync('cost-alert.txt', 'utf8').trim();
            if (!alert) return;
            const report = fs.existsSync('cost-report.md')
              ? fs.readFileSync('cost-report.md', 'utf8') : '';
            for (const label of ['automated', 'cost-alert']) {
              try { await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label, color: 'f59e0b' }); } catch (e) { if (e.status !== 422) console.warn('createLabel failed:', e.status, e.message); }
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'AI Cost Spike -- ' + new Date().toISOString().split('T')[0],
              body: '## High Usage Detected\n\n' + alert + '\n\n---\n\n' + report + '\n\n> Threshold: 100 assistant messages/day/tenant (~$0.20). Cost estimated at $0.002/message (Haiku baseline).',
              labels: ['automated', 'cost-alert']
            });

  # Prod-error scan (2026-07-15): deterministic surfacing of unhandled 500s
  # from the error_events sink (migration 156). Added because the owner-machine
  # morning digest is best-effort — the 2026-07-15 digest omitted the
  # error_events block entirely. This job needs only the same two secrets and
  # zero LLM: if anything 500'd in prod in the last 24h, an issue is filed.
  prod-error-scan:
    name: Prod Error Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan error_events (last 24h)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python - <<'PYEOF'
          import os, json, urllib.request, urllib.parse, sys
          from collections import Counter
          from datetime import datetime, timezone, timedelta

          url = os.environ.get("SUPABASE_URL", "")
          key = os.environ.get("SUPABASE_SERVICE_KEY", "")
          if not url or not key:
              print("::warning::SUPABASE_URL or SUPABASE_SERVICE_KEY not set -- skipping prod error scan")
              sys.exit(0)

          since = (datetime.now(timezone.utc) - timedelta(hours=24)).isoformat()
          params = urllib.parse.urlencode({
              "select": "created_at,path,message,status_code",
              "created_at": "gte." + since,
              "order": "created_at.desc",
              "limit": "500",
          })
          req = urllib.request.Request(
              url + "/rest/v1/error_events?" + params,
              headers={"apikey": key, "Authorization": "Bearer " + key},
          )
          with urllib.request.urlopen(req) as r:
              rows = json.loads(r.read())

          print("error_events_24h=" + str(len(rows)))
          if not rows:
              sys.exit(0)

          top = Counter((e.get("path") or "?") for e in rows).most_common(5)
          lines = [
              "## Prod errors (24h) -- " + datetime.now(timezone.utc).strftime("%Y-%m-%d"),
              "",
              "**" + str(len(rows)) + " unhandled 500(s)** in the last 24h (error_events sink).",
              "",
              "### Top paths",
          ]
          for path, count in top:
              lines.append("- `" + path + "`: " + str(count))
          lines += ["", "### Most recent"]
          for e in rows[:5]:
              msg = (e.get("message") or "").replace("\n", " ")[:160]
              lines.append("- " + str(e.get("created_at")) + " `" + str(e.get("path")) + "` " + msg)
          lines += ["", "Investigate via `SELECT * FROM error_events ORDER BY created_at DESC` (full tracebacks are stored)."]

          with open("prod-error-alert.md", "w") as f:
              f.write("\n".join(lines))
          PYEOF

      - name: Create issue on prod errors
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('prod-error-alert.md')) return;
            const body = fs.readFileSync('prod-error-alert.md', 'utf8').trim();
            if (!body) return;
            for (const label of ['automated', 'prod-errors']) {
              try { await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label, color: 'b91c1c' }); } catch (e) { if (e.status !== 422) console.warn('createLabel failed:', e.status, e.message); }
            }
            // One open tracking issue per day; skip if today's already exists.
            const today = new Date().toISOString().split('T')[0];
            const title = 'Prod errors (24h) -- ' + today;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'prod-errors', state: 'open', per_page: 50,
            });
            if (existing.data.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['automated', 'prod-errors']
            });

  # Loop-health scan (2026-07-16): the automation loops (draft expiry sweep,
  # opportunity scan -> notify -> cards) run themselves; this proves they KEEP
  # running. Vitals print to the job log daily; an issue is filed only when a
  # loop stalls (paid-tenant draft older than the sweep window, or suggestions
  # rotting undecided for 3+ weeks). Zero LLM, same two secrets.
  loop-health-scan:
    name: Loop Health Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan automation-loop vitals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/loop_health_scan.py

      - name: Create issue on loop-health alerts
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('loop-health-alert.md')) return;
            const body = fs.readFileSync('loop-health-alert.md', 'utf8').trim();
            if (!body) return;
            for (const label of ['automated', 'loop-health']) {
              try { await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label, color: 'b45309' }); } catch (e) { if (e.status !== 422) console.warn('createLabel failed:', e.status, e.message); }
            }
            // One open tracking issue per day; skip if today's already exists.
            const today = new Date().toISOString().split('T')[0];
            const title = 'Agent OS loop health -- ' + today;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'loop-health', state: 'open', per_page: 50,
            });
            if (existing.data.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['automated', 'loop-health']
            });

  # Booking-readiness scan (2026-07-15): the booking machine works, but a real
  # customer can still get 0 bookings if their tenant is misconfigured. This
  # surfaces the exact per-customer blocker (no hours / no public booking slug)
  # so the founder can act — it mutates NOTHING (customer records are
  # propose-only). Real customers only; internal/demo excluded via the shared
  # denylist.
  booking-readiness:
    name: Booking Readiness Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan booking-enabled tenants for config gaps
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.parse, sys
          import importlib.util as _ilu

          url = os.environ.get("SUPABASE_URL", "")
          key = os.environ.get("SUPABASE_SERVICE_KEY", "")
          if not url or not key:
              print("::warning::SUPABASE_URL/KEY not set — skipping booking-readiness scan")
              sys.exit(0)

          hdrs = {"apikey": key, "Authorization": "Bearer " + key}
          def get(table, params):
              req = urllib.request.Request(url + "/rest/v1/" + table + "?" + urllib.parse.urlencode(params), headers=hdrs)
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          # Canonical internal-tenant denylist (shared with the backend).
          _spec = _ilu.spec_from_file_location("internal_tenants", "backend/services/internal_tenants.py")
          _it = _ilu.module_from_spec(_spec); _spec.loader.exec_module(_it)

          tenants = get("tenants", {"select": "id,business_name,business_slug,is_demo,plan", "limit": "500"})
          tenants = [t for t in tenants if not _it.is_internal_tenant(t)]
          if not tenants:
              print("No real tenants."); sys.exit(0)

          wc = get("widget_configs", {"select": "tenant_id,booking_enabled", "limit": "1000"})
          booking_on = {w["tenant_id"] for w in wc if w.get("booking_enabled")}
          hours = get("business_hours", {"select": "tenant_id", "limit": "1000"})
          have_hours = {h["tenant_id"] for h in hours}
          appts = get("appointments", {"select": "tenant_id", "limit": "5000"})
          from collections import Counter
          appt_counts = Counter(a["tenant_id"] for a in appts if a.get("tenant_id"))

          blocked = []
          for t in tenants:
              tid = t["id"]
              if tid not in booking_on:
                  continue  # booking not enabled — not a "blocked" case
              name = t.get("business_name") or tid[:8]
              if tid not in have_hours:
                  blocked.append((name, "no business hours set — slot generation returns nothing"))
              elif not (t.get("business_slug") or "").strip():
                  blocked.append((name, "no business_slug — public booking page /api/v1/book/{slug} 404s"))
              elif appt_counts.get(tid, 0) == 0:
                  blocked.append((name, "fully configured but 0 appointments — check the widget is offering the booking link"))

          if not blocked:
              print("All booking-enabled real tenants are booking-ready."); sys.exit(0)

          lines = ["## Booking readiness — real customers blocked from bookings", ""]
          for name, why in blocked:
              lines.append(f"- **{name}**: {why}")
          lines += ["", "> No records were changed — customer records are propose-only. Fix hours/slug in the dashboard or reach out."]
          with open("booking-readiness-alert.md", "w") as f:
              f.write("\n".join(lines))
          print("\n".join(lines))
          PY

      - name: File booking-readiness issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('booking-readiness-alert.md')) return;
            const body = fs.readFileSync('booking-readiness-alert.md', 'utf8').trim();
            if (!body) return;
            for (const label of ['automated', 'booking-readiness']) {
              try { await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label, color: '7c3aed' }); } catch (e) { if (e.status !== 422) console.warn('createLabel failed:', e.status, e.message); }
            }
            const today = new Date().toISOString().split('T')[0];
            const title = 'Booking readiness — ' + today;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'booking-readiness', state: 'open', per_page: 50,
            });
            if (existing.data.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body, labels: ['automated', 'booking-readiness']
            });
