name: Autopilot Issue Loop

on:
  schedule:
    - cron: "0 */4 * * *"  # every 4h — throttled 2026-06-22 from hourly (quota still exhausting). Use workflow_dispatch for an immediate run.
  workflow_dispatch:

concurrency:
  group: autopilot-issue-loop
  cancel-in-progress: false

jobs:
  classify-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTOPILOT_GH_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install autopilot dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install anthropic httpx

      - name: Run classifier and dispatcher
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTOPILOT_GH_TOKEN: ${{ secrets.AUTOPILOT_GH_TOKEN }}
          GH_TOKEN: ${{ secrets.AUTOPILOT_GH_TOKEN }}
          AUTOPILOT_MAX_TOKENS_PER_RUN: ${{ vars.AUTOPILOT_MAX_TOKENS_PER_RUN || '200000' }}
          AUTOPILOT_MAX_ACTIVE_RUNS: ${{ vars.AUTOPILOT_MAX_ACTIVE_RUNS || '1' }}
        run: python scripts/autopilot/classify_and_dispatch.py
