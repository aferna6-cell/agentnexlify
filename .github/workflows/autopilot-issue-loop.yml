name: Autopilot Issue Loop

on:
  schedule:
    # cron parked 2026-07-20: AUTOPILOT_GH_TOKEN expired (#399) so every run
    # failed AND burned minutes (#500). Feb 31 never fires — restore
    # "0 */4 * * *" after rotating the token.
    - cron: "0 6 31 2 *" # never fires (Feb 31)
  workflow_dispatch:

concurrency:
  group: autopilot-issue-loop
  cancel-in-progress: false

jobs:
  classify-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      # AUTOPILOT_GH_TOKEN expired 2026-07-04 and silently killed the loop for
      # 5+ days (#399). Validate the PAT up front and fall back to the
      # auto-provisioned github.token (which never expires and covers this
      # repo via the permissions block above). Tradeoff: PRs opened with
      # github.token do not trigger downstream workflows — acceptable, the
      # loop being alive beats CI-trigger fidelity.
      - name: Resolve GitHub token (PAT with fallback)
        env:
          PAT: ${{ secrets.AUTOPILOT_GH_TOKEN }}
          FALLBACK: ${{ github.token }}
        run: |
          if [ -n "$PAT" ] && curl -sf -H "Authorization: Bearer $PAT" https://api.github.com/rate_limit > /dev/null; then
            echo "EFFECTIVE_GH_TOKEN=$PAT" >> "$GITHUB_ENV"
            echo "Using AUTOPILOT_GH_TOKEN"
          else
            echo "EFFECTIVE_GH_TOKEN=$FALLBACK" >> "$GITHUB_ENV"
            echo "::warning::AUTOPILOT_GH_TOKEN missing or expired — falling back to github.token (autopilot PRs will not trigger CI). Rotate the PAT to restore CI triggering (#399)."
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ env.EFFECTIVE_GH_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install autopilot dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install anthropic httpx

      - name: Run classifier and dispatcher
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTOPILOT_GH_TOKEN: ${{ env.EFFECTIVE_GH_TOKEN }}
          GH_TOKEN: ${{ env.EFFECTIVE_GH_TOKEN }}
          AUTOPILOT_MAX_TOKENS_PER_RUN: ${{ vars.AUTOPILOT_MAX_TOKENS_PER_RUN || '200000' }}
          AUTOPILOT_MAX_ACTIVE_RUNS: ${{ vars.AUTOPILOT_MAX_ACTIVE_RUNS || '1' }}
        run: python scripts/autopilot/classify_and_dispatch.py
