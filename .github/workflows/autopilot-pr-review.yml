name: Autopilot PR Review Handler

on:
  pull_request_review_comment:
    types: [created]

concurrency:
  group: autopilot-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  handle-comment:
    if: contains(github.event.pull_request.labels.*.name, 'autopilot-pr') && github.event.comment.user.login != github.event.pull_request.user.login
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      # Same PAT-expiry guard as autopilot-issue-loop.yml (#399): validate
      # AUTOPILOT_GH_TOKEN, fall back to github.token so an expired PAT can
      # never silently kill review handling.
      - name: Resolve GitHub token (PAT with fallback)
        env:
          PAT: ${{ secrets.AUTOPILOT_GH_TOKEN }}
          FALLBACK: ${{ github.token }}
        run: |
          if [ -n "$PAT" ] && curl -sf -H "Authorization: Bearer $PAT" https://api.github.com/rate_limit > /dev/null; then
            echo "EFFECTIVE_GH_TOKEN=$PAT" >> "$GITHUB_ENV"
            echo "Using AUTOPILOT_GH_TOKEN"
          else
            echo "EFFECTIVE_GH_TOKEN=$FALLBACK" >> "$GITHUB_ENV"
            echo "::warning::AUTOPILOT_GH_TOKEN missing or expired — falling back to github.token. Rotate the PAT to restore CI triggering (#399)."
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ env.EFFECTIVE_GH_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install autopilot dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install anthropic

      - name: Implement review comment
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ env.EFFECTIVE_GH_TOKEN }}
          AUTOPILOT_MAX_TOKENS_PER_RUN: ${{ vars.AUTOPILOT_MAX_TOKENS_PER_RUN || '200000' }}
        run: python scripts/autopilot/implement_review_comment.py
