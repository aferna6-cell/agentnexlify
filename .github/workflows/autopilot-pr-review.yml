name: Autopilot PR Review Handler

on:
  pull_request_review_comment:
    types: [created]

concurrency:
  group: autopilot-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  handle-comment:
    if: contains(github.event.pull_request.labels.*.name, 'autopilot-pr') && github.event.comment.user.login != github.event.pull_request.user.login
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.AUTOPILOT_GH_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install autopilot dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install anthropic

      - name: Implement review comment
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.AUTOPILOT_GH_TOKEN }}
          AUTOPILOT_MAX_TOKENS_PER_RUN: ${{ vars.AUTOPILOT_MAX_TOKENS_PER_RUN || '200000' }}
        run: python scripts/autopilot/implement_review_comment.py
