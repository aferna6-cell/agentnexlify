name: Field Monitor Weekly Digest

# Runs the Claude Managed Agents Field Monitor. Manual-only since the Monday
# 8 AM ET cron was removed (see the `on:` block)
# (12:00 UTC) and commits the generated Markdown digest to
# knowledge-base/raw/. The kb-compile pipeline then promotes the raw
# file to the wiki with embeddings.
#
# Manual trigger is also available via workflow_dispatch for ad-hoc
# mid-week runs or backfills.
#
# WHY THIS STILL USES A RUNNER (reviewed 2026-08-24)
# A Managed Agents *scheduled deployment* would run this agent on Anthropic's
# infrastructure with no runner at all, and support for that now exists
# (backend/services/managed_agents_deployments.py,
# scripts/managed_agents/provision_deployments.py). This job cannot migrate
# yet: the runner's second responsibility is `git commit` + `git push` of the
# digest into knowledge-base/raw/ so the kb-compile pipeline can promote it,
# and a deployment session runs in Anthropic's sandbox and cannot push to git.
# Moving the schedule without first solving output persistence would silently
# stop the digest from ever landing. See the "Which jobs can actually migrate"
# section in scripts/managed_agents/provision_deployments.py for the two
# viable designs.

on:
  # NO `schedule:` — Actions have been dark since 2026-07-20 (GH #500,
  # spending limit): jobs die in ~1s before checkout, so this monitored
  # nothing while still reporting red. Uniform red hides the next real
  # failure, so the schedule is removed rather than left to fail on a timer.
  # `workflow_dispatch` is retained — this is still runnable by hand.
  #
  # UNOWNED — no replacement is running. Previous cron: "0 12 * * 1".
  # Commits the digest to the working tree, so a sandboxed Managed Agents
  # deployment cannot host it (it cannot `git push`). Routine or nothing.
  # Tracked in: planning/decisions/2026-08-24-actions-replacement-substrate.md
  workflow_dispatch:
    inputs:
      topic:
        description: "Focus topic for the digest (optional)"
        required: false
        default: "AI, automation, and SMB SaaS relevant to service-business automation"

jobs:
  field-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run Field Monitor managed agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MANAGED_AGENTS_ENVIRONMENT_ID: ${{ secrets.MANAGED_AGENTS_ENVIRONMENT_ID }}
          FIELD_MONITOR_AGENT_ID: ${{ secrets.FIELD_MONITOR_AGENT_ID }}
          # These must exist for backend/config.py to import cleanly, even
          # though field_monitor doesn't use them.
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Hard per-session spend ceiling (cents). This job runs unattended on
          # a schedule; without a cap a runaway tool loop bills unbounded.
          # Consumed by scripts/managed_agents/_smoke_common.py.
          MANAGED_AGENTS_SESSION_BUDGET_CENTS: "300"
          # Untrusted workflow_dispatch input reaches the shell through the
          # environment, never through ${{ }} interpolation inside `run:`.
          # Interpolating it directly is a command-injection sink.
          TOPIC_INPUT: ${{ github.event.inputs.topic }}
        run: |
          TOPIC="$TOPIC_INPUT"
          if [ -z "$TOPIC" ]; then
            TOPIC="AI, automation, and SMB SaaS relevant to service-business automation"
          fi
          python -m scripts.managed_agents.field_monitor_run --topic "$TOPIC"

      - name: Commit digest to knowledge-base/raw/
        run: |
          git config user.name "field-monitor-bot"
          git config user.email "field-monitor-bot@users.noreply.github.com"
          if ls knowledge-base/raw/field-monitor-*.md >/dev/null 2>&1; then
            git add knowledge-base/raw/field-monitor-*.md
            if git diff --cached --quiet; then
              echo "No new digest file to commit."
            else
              git commit -m "chore(field-monitor): weekly digest $(date -u +%Y-%m-%d)"
              git push
            fi
          else
            echo "::warning::field_monitor_run did not produce a digest file."
          fi
