name: Railway Error Watch

# Polls Railway deploy logs every 10 minutes for WARNING/ERROR levelname
# entries and posts new ones to Slack. Opt-in — set the two required
# repository secrets and this workflow starts firing on the schedule.
#
# Required secrets:
#   RAILWAY_TOKEN           — project token (https://railway.com/account/tokens)
#   SLACK_ALERT_WEBHOOK_URL — Slack incoming webhook
#
# Disable by removing the secrets (workflow exits 0 silently without
# spamming Slack) or by deleting this file.

on:
  schedule:
    - cron: "0 * * * *"  # throttled 2026-06-18 from */10 to hourly to conserve Actions minutes (exhausted quota)
  workflow_dispatch: {}

concurrency:
  group: railway-error-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'aferna6-cell/agentnexlify' }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/monitoring
            .github/workflows
          sparse-checkout-cone-mode: false

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.com/install.sh | sh
          echo "${HOME}/.railway/bin" >> "$GITHUB_PATH"

      - name: Cache dedup state
        uses: actions/cache@v4
        with:
          path: /tmp/railway-error-seen.txt
          key: railway-error-seen-${{ github.run_id }}
          restore-keys: |
            railway-error-seen-

      - name: Scan Railway logs and post to Slack
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SLACK_ALERT_WEBHOOK_URL: ${{ secrets.SLACK_ALERT_WEBHOOK_URL }}
          LOOKBACK_LINES: "400"
        run: |
          if [ -z "${RAILWAY_TOKEN}" ] || [ -z "${SLACK_ALERT_WEBHOOK_URL}" ]; then
            echo "::notice::RAILWAY_TOKEN or SLACK_ALERT_WEBHOOK_URL not set — skipping scan"
            exit 0
          fi
          chmod +x scripts/monitoring/railway-error-to-slack.sh
          bash scripts/monitoring/railway-error-to-slack.sh
