name: Railway Error Watch

# Polls Railway deploy logs every 10 minutes for WARNING/ERROR levelname
# entries and emails new ones to the owner via Resend. Opt-in, set the
# required repository secrets and this workflow starts firing on the schedule.
#
# Required secrets:
#   RAILWAY_TOKEN     project token (https://railway.com/account/tokens)
#   RESEND_API_KEY    Resend API key, same key the backend already uses
#   OWNER_ALERT_EMAIL recipient address for monitoring alerts
#
# Disable by removing the secrets (workflow exits 0 silently without
# emailing) or by deleting this file.

on:
  schedule:
    - cron: "0 */4 * * *"  # every 4h — throttled 2026-06-22 from hourly (quota still exhausting). Real-time error capture belongs on Sentry, not log polling.
  workflow_dispatch: {}

concurrency:
  group: railway-error-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'aferna6-cell/agentnexlify' }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/monitoring
            .github/workflows
          sparse-checkout-cone-mode: false

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.com/install.sh | sh
          echo "${HOME}/.railway/bin" >> "$GITHUB_PATH"

      - name: Cache dedup state
        uses: actions/cache@v6
        with:
          path: /tmp/railway-error-seen.txt
          key: railway-error-seen-${{ github.run_id }}
          restore-keys: |
            railway-error-seen-

      - name: Scan Railway logs and email new errors
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_ALERT_EMAIL: ${{ secrets.OWNER_ALERT_EMAIL }}
          LOOKBACK_LINES: "400"
          DEDUP_STATE_FILE: /tmp/railway-error-seen.txt
        run: |
          if [ -z "${RAILWAY_TOKEN}" ] || [ -z "${RESEND_API_KEY}" ] || [ -z "${OWNER_ALERT_EMAIL}" ]; then
            echo "::notice::RAILWAY_TOKEN, RESEND_API_KEY, or OWNER_ALERT_EMAIL not set, skipping scan"
            exit 0
          fi

          chmod +x scripts/monitoring/send-alert-email.sh
          touch "${DEDUP_STATE_FILE}"

          # Pull recent WARNING/ERROR log lines from Railway.
          RAW_LOGS="$(railway logs \
            --lines "${LOOKBACK_LINES}" \
            --filter 'levelname="ERROR" OR levelname="WARNING"' \
            2>/dev/null || true)"

          if [ -z "${RAW_LOGS}" ]; then
            echo "railway-error-watch: no new errors/warnings in window"
            exit 0
          fi

          # Dedup each line by hash so the same error does not email every run.
          NEW_LINES=""
          NEW_COUNT=0
          while IFS= read -r line; do
            [ -z "${line}" ] && continue
            if echo "${line}" | grep -qE 'levelname="(ERROR|WARNING)"|Traceback \(most recent call last\)'; then
              HASH="$(printf '%s' "${line}" | sha1sum | awk '{print $1}')"
              if ! grep -q "^${HASH}$" "${DEDUP_STATE_FILE}"; then
                NEW_LINES="$(printf '%s%s\n' "${NEW_LINES}" "${line}")"
                echo "${HASH}" >> "${DEDUP_STATE_FILE}"
                NEW_COUNT=$((NEW_COUNT + 1))
              fi
            fi
          done <<< "${RAW_LOGS}"

          # Keep dedup state bounded.
          if [ "$(wc -l < "${DEDUP_STATE_FILE}")" -gt 2000 ]; then
            tail -n 2000 "${DEDUP_STATE_FILE}" > "${DEDUP_STATE_FILE}.tmp"
            mv "${DEDUP_STATE_FILE}.tmp" "${DEDUP_STATE_FILE}"
          fi

          if [ "${NEW_COUNT}" -eq 0 ]; then
            echo "railway-error-watch: all warnings/errors already seen"
            exit 0
          fi

          SUBJECT="Railway warnings/errors: ${NEW_COUNT} new line(s)"
          BODY="$(printf 'Railway log watch found %d new WARNING/ERROR line(s):\n\n%s' "${NEW_COUNT}" "${NEW_LINES}")"

          # Best-effort email. Never hard-fails the workflow.
          bash scripts/monitoring/send-alert-email.sh "${SUBJECT}" "${BODY}"
