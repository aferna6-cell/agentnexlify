name: Public Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  # NO `schedule:` — Actions have been dark since 2026-07-20 (GH #500,
  # spending limit): jobs die in ~1s before checkout, so this monitored
  # nothing while still reporting red. Uniform red hides the next real
  # failure, so the schedule is removed rather than left to fail on a timer.
  # `workflow_dispatch` is retained — this is still runnable by hand.
  #
  # OWNED ELSEWHERE — do not restore. The Routine "Prod Uptime Watch (CCR)"
  # (cron 56 * * * *) names this workflow explicitly in its own prompt:
  # "replaces the GitHub Actions public-uptime-watch/public-smoke
  # workflows". Restoring "15 6 * * *" gives two probes alerting on the
  # same outage from two sources — the duplicate-writer trap already
  # defused for public-uptime-watch in #680.
  # Tracked in: planning/decisions/2026-08-24-actions-replacement-substrate.md

concurrency:
  group: public-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Public Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run marketing smoke checks with retry
        env:
          PUBLIC_BASE_URL: ${{ secrets.PRODUCTION_PUBLIC_URL || 'https://agentnexlify.vercel.app' }}
          API_BASE_URL: ${{ secrets.PRODUCTION_API_URL || 'https://agentnexlify-production.up.railway.app' }}
          PUBLIC_WIDGET_API_KEY: ${{ secrets.PRODUCTION_WIDGET_API_KEY }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            echo "Marketing smoke attempt $attempt"
            if python scripts/public_smoke.py; then
              exit 0
            fi
            if [ "$attempt" = "6" ]; then
              exit 1
            fi
            sleep 30
          done

      - name: Run app smoke checks when configured
        env:
          APP_PUBLIC_URL: ${{ secrets.APP_PUBLIC_URL }}
          API_BASE_URL: ${{ secrets.PRODUCTION_API_URL || 'https://agentnexlify-production.up.railway.app' }}
          PUBLIC_WIDGET_API_KEY: ${{ secrets.PRODUCTION_WIDGET_API_KEY }}
        run: |
          if [ -z "$APP_PUBLIC_URL" ]; then
            echo "Skipping app smoke checks because APP_PUBLIC_URL is not set."
            exit 0
          fi

          export PUBLIC_BASE_URL="$APP_PUBLIC_URL"
          for attempt in 1 2 3 4 5 6; do
            echo "App smoke attempt $attempt"
            if python scripts/public_smoke.py; then
              exit 0
            fi
            if [ "$attempt" = "6" ]; then
              exit 1
            fi
            sleep 30
          done
