[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-os"
version = "1.0.0"
description = "Orchestrator + 18 worker agents for small-business automation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Live drafting via Claude. The demo runs fully offline without this.
llm = ["anthropic>=0.40"]
# Test + API client deps (httpx backs Starlette's TestClient).
test = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
agent-os-demo = "agent_os.demo.cli:main"

[tool.setuptools.packages.find]
include = ["agent_os*"]

[tool.pytest.ini_options]
# Make the package importable without an install step, and own the rootdir so
# the parent repo's pytest config (asyncio_mode/timeout) doesn't leak in.
pythonpath = ["."]
testpaths = ["tests"]
