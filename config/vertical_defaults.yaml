      a: "Yes, we offer 24/7 emergency HVAC service. Whether your AC goes out in summer or your heat fails in winter, our technicians are on call."
    - q: "How often should I service my HVAC system?"
      a: "We recommend a professional tune-up twice a year — once in spring before cooling season and once in fall before heating season. Regular maintenance extends system life and lowers energy bills."
    - q: "What brands do you service?"
      a: "We service all major brands including Carrier, Trane, Lennox, Rheem, and many more. Our technicians are trained and certified across brands."
    - q: "How long does an AC installation take?"
      a: "A standard residential AC installation typically takes 4-8 hours depending on the size of the system and any required ductwork modifications."
    - q: "Do you offer financing?"
      a: "Yes, we offer flexible financing options for system replacements and major repairs. Ask about our 0% interest plans for qualified customers."
    - q: "What is your warranty policy?"
      a: "We offer a 1-year labor warranty on all repairs and pass through full manufacturer warranties on new equipment, which typically range from 5-10 years."
