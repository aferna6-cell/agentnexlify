power_washing:
  display_name: "Power Washing"
  default_services:
    - "Driveway & Sidewalk Washing"
    - "House Exterior Washing"
    - "Deck & Patio Cleaning"
    - "Roof Soft Washing"
    - "Fence Cleaning"
    - "Commercial Pressure Washing"
    - "Gutter Cleaning & Flushing"
    - "Graffiti Removal"
  default_faqs:
    - q: "How often should I get my house power washed?"
      a: "For most homes we recommend once a year. Homes near trees or in humid climates may benefit from washing every 6 months to prevent mold and mildew buildup."
    - q: "Will pressure washing damage my siding?"
      a: "We use the appropriate pressure and technique for each surface. Vinyl siding, painted wood, and brick all receive different treatment. Delicate surfaces get soft washing instead of high pressure."
    - q: "Do you treat for mold and mildew?"
      a: "Yes, our cleaning solutions include EPA-approved mold and mildew treatments that kill growth at the root, not just wash it away."
    - q: "How long does it take to wash a house?"
      a: "An average single-story home takes 2-3 hours. Two-story homes typically take 3-5 hours. We will give you a specific estimate when you book."
    - q: "Do I need to be home during service?"
      a: "You do not need to be home as long as we have access to an outdoor water spigot. We will send photos when the job is complete."
    - q: "What is your pricing based on?"
      a: "Pricing is based on square footage and the surface type. We offer free instant quotes — just let us know the size of what you need washed."
