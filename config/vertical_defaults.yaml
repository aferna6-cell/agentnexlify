    - "Generator Installation"
    - "Smoke & CO Detector Installation"
  default_faqs:
    - q: "Is your work up to code?"
      a: "All of our electrical work meets or exceeds local building codes. We pull permits where required and our work passes inspection."
    - q: "When should I upgrade my electrical panel?"
      a: "Consider an upgrade if your panel is over 25 years old, you are adding major appliances, have breakers that frequently trip, or are adding an EV charger or home addition."
    - q: "Do you install EV chargers?"
      a: "Yes, we install Level 2 home EV charging stations for all major car brands. We handle the permitting and inspection process from start to finish."
    - q: "What is a safety inspection and do I need one?"
      a: "A safety inspection checks your panel, wiring, outlets, and grounding for hazards. We recommend one for homes over 20 years old or before buying a home."
    - q: "Are your electricians licensed?"
      a: "All of our electricians are licensed master or journeyman electricians. We carry full liability and workers compensation insurance."
    - q: "How do I know if I have an electrical emergency?"
      a: "Call us immediately if you smell burning near outlets, see flickering lights throughout the home, have a breaker that will not reset, or notice scorch marks on outlets or panels."
